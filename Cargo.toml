[workspace]
resolver = "3"
members = ["crates/cloud-calendar-api", "crates/cloud-calendar", "crates/cloud-calendar-gtk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ferdousbhai/cloud-calendar"

[workspace.dependencies]
cloud-calendar-api = { path = "crates/cloud-calendar-api" }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
# The client every iCloud app on this machine shares: icloud-sessiond's one web sign-in.
icloud-session = { git = "https://github.com/ferdousbhai/icloud-for-omarchy", rev = "3d7df8200a06f07a3afd941a9d632955efbfd7b4" }
iana-time-zone = "0.1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
lto = "thin"
strip = true
