[package]
name = "cloud-calendar-gtk"
description = "Native GTK4 app for Cloud Calendar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cloud-calendar-api.workspace = true
chrono.workspace = true
# The look, the icons and the shared widgets, pinned by commit.
omui = { git = "https://github.com/ferdousbhai/omui", rev = "d5796183fdcc1dab218c7af5343bc0f29389db0e" } # v0.5.7
# The GTK 4 omui is built on; cargo resolves both to one gtk4.
gtk = { version = "0.11", package = "gtk4", features = ["v4_16"] }
serde_json.workspace = true

[features]
# omui's scripted QA (dev/qa.sh, run by bin/check); release builds leave it off.
qa = ["omui/qa"]
