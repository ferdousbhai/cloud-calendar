[package]
name = "cloud-calendar-gtk"
description = "Native GTK4 app for Cloud Calendar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cloud-calendar-api.workspace = true
chrono.workspace = true
# The look, the icons and the shared widgets, pinned by commit (v0.4.0).
omui = { git = "https://github.com/ferdousbhai/omui", rev = "2d34cf50a29a8ad5338d94d4d9e46c1587f7ef40" }
# The GTK 4 omui is built on; cargo resolves both to one gtk4.
gtk = { version = "0.11", package = "gtk4", features = ["v4_16"] }
serde_json.workspace = true
