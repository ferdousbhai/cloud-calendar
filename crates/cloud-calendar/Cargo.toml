[package]
name = "cloud-calendar"
description = "Command-line client for Cloud Calendar (iCloud, Google and HEY calendars), built for people and agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cloud-calendar"
path = "src/main.rs"

[dependencies]
cloud-calendar-api.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "wrap_help", "env"] }

[dev-dependencies]
base64.workspace = true
